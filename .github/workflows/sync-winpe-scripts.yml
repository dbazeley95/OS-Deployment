name: Sync WinPE scripts to R2

# The WinPE image fetches DeployGui.ps1/PostAction.ps1 fresh from R2 on
# every boot (see boot/winpe/README.md) rather than having them baked into
# the image - this is what makes that actually zero-touch: push here, and
# the next boot picks it up.
on:
  push:
    branches: [main]
    paths:
      - "boot/winpe/*.ps1"
      - "boot/winpe/*.png"
      - ".github/workflows/sync-winpe-scripts.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install
      - name: Upload boot/winpe/*.ps1 to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in ../boot/winpe/*.ps1; do
            name="$(basename "$f")"
            echo "Uploading winpe/$name..."
            npx wrangler r2 object put "os-deployment-images/winpe/$name" --file "$f"
            # Same-origin SHA256 companion - bootstrap.ps1/DeployGui.ps1 fetch
            # this alongside the script to catch a corrupted or truncated
            # download (a real WinPE network-boot failure mode). It's not
            # tamper-proofing: anyone who could alter the script in R2 could
            # alter this file too - see boot/winpe/README.md.
            hash="$(sha256sum "$f" | cut -d' ' -f1)"
            echo -n "$hash" > "/tmp/$name.sha256"
            npx wrangler r2 object put "os-deployment-images/winpe/$name.sha256" --file "/tmp/$name.sha256" --content-type "text/plain"
          done
      - name: Upload boot/winpe/*.png to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in ../boot/winpe/*.png; do
            name="$(basename "$f")"
            echo "Uploading winpe/$name..."
            npx wrangler r2 object put "os-deployment-images/winpe/$name" --file "$f" --content-type "image/png"
          done
