#cloud-config
autoinstall:
  version: 1
  identity:
    hostname: ubuntu-reimaged
    username: admin
    # Generate with: mkpasswd --method=SHA-512 --rounds=4096
    password: "$6$REPLACE_WITH_HASHED_PASSWORD"
  ssh:
    install-server: true
    allow-pw: false
    # authorized-keys: ["ssh-ed25519 AAAA... you@example.com"]
  storage:
    layout:
      name: direct
  packages:
    - curl
  late-commands:
    # Phone home to the Worker so the admin UI sees this job flip to "complete".
    # Replace <worker-origin> with your deployed Worker's URL.
    - curl -sS -X PATCH -H "Content-Type: application/json" -d '{"status":"complete"}'
      "https://<worker-origin>/api/jobs/by-mac/$(ip link show | awk '/ether/{print $2; exit}')"
  reporting:
    builtin:
      type: print
