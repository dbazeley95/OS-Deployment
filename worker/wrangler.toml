name = "os-deployment-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Requires osd.xcet.uk already on Cloudflare as a zone (it is) - Cloudflare
# provisions the DNS record and TLS cert for this automatically on deploy.
[[routes]]
pattern = "api.osd.xcet.uk"
custom_domain = true

# Create with: wrangler d1 create os-deployment
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "os-deployment"
database_id = "b427c861-e731-49d9-ae51-76b283e86ff2"

# Create with: wrangler r2 bucket create os-deployment-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "os-deployment-images"

[vars]
# Origin of the admin UI, for CORS on /api/*.
ALLOWED_ORIGIN = "https://osd.xcet.uk"
