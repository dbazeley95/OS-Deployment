name = "os-deployment-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Create with: wrangler d1 create os-deployment
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "os-deployment"
database_id = "b427c861-e731-49d9-ae51-76b283e86ff2"

# Create with: wrangler r2 bucket create os-deployment-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "os-deployment-images"

[vars]
# Comma-separated list of allowed origins for the admin UI (Cloudflare Pages URL).
ALLOWED_ORIGIN = "*"
